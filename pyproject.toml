[project]
name = "py-stars"
version = "0.1.0"
description = "Detect and identify stars in iPhone HEIC photos using tetra3 plate solving"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pillow-heif>=1.0.0",
    "pillow>=12.0.0",
    "tetra3rs>=0.9.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "opencv-python-headless>=4.10.0",
    "matplotlib>=3.9.0",
]

[project.scripts]
py-stars = "py_stars:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
